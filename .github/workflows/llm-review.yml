
name: LLM Code Review & Email Notification

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - develop

jobs:
  review_and_notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: get_diff
        run: |
          git fetch origin ${{ github.base_ref }} || true
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- '*.py' 2>/dev/null || echo "No Python files changed")
          DIFF_LIMITED="${DIFF:0:5000}"
          if [ -z "$DIFF_LIMITED" ]; then
            DIFF_LIMITED="Aucun changement Python détecté."
          fi
          {
            echo 'diff<<EOFMARKER'
            echo "$DIFF_LIMITED"
            echo 'EOFMARKER'
          } >> $GITHUB_OUTPUT

      - name: Call Gemini API
        id: gemini_review
        run: |
          DIFF_CONTENT=$(cat << 'ENDDIFF'
          ${{ steps.get_diff.outputs.diff }}
          ENDDIFF
          )
          
          PROMPT="Tu es un relecteur de code expert en Python/FastAPI. Analyse ce diff.

          Instructions:
          - Si le code est bon, donne 2-3 suggestions constructives
          - Si tu détectes des bugs, liste-les
          - Si tu vois des problèmes de sécurité, mentionne-les
          - Sois concis et professionnel
          - Réponds en français
          
          Diff:
          ${DIFF_CONTENT}"
          
          PROMPT_JSON=$(jq -n --arg text "$PROMPT" '{contents:[{parts:[{text:$text}]}]}')
          
          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PROMPT_JSON")
          
          REVIEW=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "⚠️ Erreur: Impossible de générer la revue. Vérifiez la clé API."')
          
          {
            echo 'review<<EOFMARKER'
            echo "$REVIEW"
            echo 'EOFMARKER'
          } >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const review = `## 🤖 Revue de code par IA
            
            Bonjour @${{ github.actor }} ! Voici l'analyse automatique de votre code :
            
            ---
            
            ${{ steps.gemini_review.outputs.review }}
            
            ---
            *Cette revue a été générée automatiquement par Gemini AI*`;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: review
            });

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🔔 Revue LLM pour PR #${{ github.event.pull_request.number }} par @${{ github.actor }}"
          to: ${{ secrets.TEAM_EMAIL_LIST }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Bonjour l'équipe !
            
            Une nouvelle revue de code automatique a été générée pour la Pull Request #${{ github.event.pull_request.number }}.
            
            📋 Pull Request : ${{ github.event.pull_request.title }}
            👤 Auteur : @${{ github.actor }}
            🔗 Lien : ${{ github.event.pull_request.html_url }}
            
            🤖 Revue de l'IA :
            
            ${{ steps.gemini_review.outputs.review }}
            
            ---
            Consultez la PR sur GitHub pour plus de détails.